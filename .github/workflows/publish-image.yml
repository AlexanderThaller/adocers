name: Publish image

on:
  push:
    branches: [ "main" ]

# packages: write is what lets GITHUB_TOKEN push to this repository's own
# GHCR namespace (ghcr.io/alexanderthaller/adocers) -- no separate PAT or
# secret to manage or rotate. id-token: write is what lets `cosign sign`
# obtain a short-lived Sigstore certificate bound to this workflow's OIDC
# identity, so signing needs no key to generate or store either. Both are
# granted here rather than repo-wide, so that a workflow added later -- one
# running on untrusted pull_request checkouts, say -- does not inherit them.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false because nothing here authenticates to git;
      # it pushes to the container registry and nowhere else. The default
      # would leave GITHUB_TOKEN in .git/config as an http.extraheader for the
      # rest of the job -- readable by every build script Nix and Cargo go on
      # to run.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Set up the Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short commit sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `nix build` alone would leave `result` a symlink into the store;
      # readlink resolves it to the actual store path so later steps do not
      # each have to re-derive it.
      #
      # `.#container` builds `.#adocers` first and runs its test suites on the
      # way -- `doCheck` is on -- so a broken build never reaches the
      # registry.
      - name: Build the image
        id: build
        run: |
          nix build '.#container'
          echo "archive=$(readlink -f result)" >> "$GITHUB_OUTPUT"

      # Every tag this push lands on is named here explicitly: a moving
      # `latest` and an immutable `sha-<short-sha>` a rollback can pin to. No
      # version tag: this runs on every push to main, and a `0.3.0` that moved
      # each time would be a release tag that is not one. The image still
      # carries the version as a label, and a release workflow triggered on a
      # git tag is where an immutable one would belong.
      #
      # skopeo copies straight from the Nix-built docker-archive tarball, no
      # `docker load` in between.
      - name: Push the image
        run: |
          for tag in "sha-${{ steps.sha.outputs.short }}" latest; do
            nix run nixpkgs#skopeo -- copy \
              "docker-archive:${{ steps.build.outputs.archive }}" \
              "docker://ghcr.io/alexanderthaller/adocers:$tag"
          done

      # Resolved from the registry right after the push, not computed
      # locally beforehand: a local digest (from the docker-archive tarball,
      # or from skopeo's own --digestfile) does not reliably match what the
      # registry ends up serving back for the same content. Reading the sha
      # tag back immediately after pushing it is the one thing every
      # consumer -- cosign, trivy, a puller -- resolves to the same answer,
      # and it carries no race-condition risk cosign's own "sign by tag"
      # warning is about: this tag is unique to this build and nothing else
      # ever pushes to it.
      - name: Resolve the pushed digest
        id: image
        run: |
          digest=$(nix run nixpkgs#skopeo -- inspect \
            "docker://ghcr.io/alexanderthaller/adocers:sha-${{ steps.sha.outputs.short }}" \
            --format '{{.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless: no `--key`, so cosign looks for the ambient GitHub Actions
      # OIDC token (from id-token: write above) and gets a short-lived
      # Fulcio certificate for it instead. Signs by digest, per cosign's own
      # advice, not by any of the mutable tags just pushed.
      - name: Sign the image
        run: |
          nix run nixpkgs#cosign -- sign --yes \
            "ghcr.io/alexanderthaller/adocers@${{ steps.image.outputs.digest }}"

      # Scans the image that was just pushed, by digest: what is attached
      # should describe what a puller actually gets, not the local build
      # tree. SPDX because it is the format with the widest set of readers.
      #
      # `cosign attach sbom` is deprecated in favour of SBOM attestations.
      # It is used here because it is what antors publishes too, so both
      # images answer to the same tooling; revisit together if cosign drops
      # the command.
      - name: Generate and attach the SBOM
        run: |
          nix run nixpkgs#trivy -- image --format spdx-json --output sbom.spdx.json \
            "ghcr.io/alexanderthaller/adocers@${{ steps.image.outputs.digest }}"
          nix run nixpkgs#cosign -- attach sbom --type spdx --sbom sbom.spdx.json \
            "ghcr.io/alexanderthaller/adocers@${{ steps.image.outputs.digest }}"
