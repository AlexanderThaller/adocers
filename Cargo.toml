[package]
name = "adocers"
version = "0.1.0"
edition = "2024"
description = "Render AsciiDoc documents to HTML, with source-anchored diagnostics and a watch mode"
license = "MIT OR Apache-2.0"

[features]
default = ["serve", "highlight", "math", "mermaid"]
serve = ["dep:axum", "dep:tokio", "dep:tokio-util", "dep:tower-http"]

# Draw mermaid diagrams, with `merman`. Without it a diagram renders as the
# listing block it was written as.
mermaid = ["dep:merman"]

# Equations, converted to MathML for the browser to draw. Without it an
# equation renders as the notation it was written in.
math = ["dep:math-core", "dep:asciimath-rs"]

# Syntax highlighting, and the grammars it parses with.
highlight = [
  "dep:tree-sitter",
  "dep:tree-sitter-highlight",
  "dep:tree-sitter-rust",
  "dep:tree-sitter-python",
  "dep:tree-sitter-javascript",
  "dep:tree-sitter-typescript",
  "dep:tree-sitter-go",
  "dep:tree-sitter-c",
  "dep:tree-sitter-bash",
  "dep:tree-sitter-json",
  "dep:tree-sitter-toml-ng",
  "dep:tree-sitter-yaml",
  "dep:tree-sitter-html",
  "dep:tree-sitter-css",
  "dep:tree-sitter-java",
]
tower-http = ["dep:tower-http"]

[dependencies]
anyhow = "1"
ariadne = "0.6"
asciidoc-parser = "0.31"
asciimath-rs = { version = "0.6.2", optional = true }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
], optional = true }
clap = { version = "4", features = ["derive"] }
math-core = { version = "0.8.2", optional = true }
merman = { version = "0.8.0-alpha.6", features = ["svg"], optional = true }
notify-debouncer-full = "0.7"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "signal",
  "fs",
  "time",
  "sync",
], optional = true }
tokio-util = { version = "0.7", default-features = false, features = [
  "io",
], optional = true }
tower-http = { version = "0.7", features = [
  "compression-gzip",
  "compression-br",
], optional = true }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-highlight = { version = "0.27", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }

[[bench]]
name = "render"
harness = false

[lints.rust]
#missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# The library target exists so the benchmarks can reach the code; it is not an
# API anyone depends on, so it is not held to one.
must_use_candidate = "allow"

[profile.deploy]
inherits = "release"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
