[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexanderThaller/adocers"
# `kstring` and `math-core` are what set this; nothing here asks for more.
rust-version = "1.96"

[workspace.dependencies]
adocers-html = { version = "0.1", path = "crates/adocers-html" }
adocers-render-core = { version = "0.1", path = "crates/adocers-render-core" }
adocers-typst = { version = "0.1", path = "crates/adocers-typst" }
anyhow = "1"
asciidoc-parser = "0.31"
asciimath-rs = "0.6.2"
math-core = "0.8.2"
merman = { version = "0.8.0-alpha.6", features = ["svg"] }
mitex = "0.2"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.27"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
typst = "0.15"
typst-as-lib = { version = "0.16", features = [
  "typst-kit-fonts",
  "typst-kit-embed-fonts",
] }
typst-pdf = "0.15"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
# A `pub` item nothing outside the crate can reach is not API, it only looks
# like it — and on a published crate that is a promise nobody meant to make.
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

# The back ends are published, so their documentation is read by people who
# cannot see the source beside it.
[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
# An unclosed backtick silently swallows the rest of the line, which is easy to
# miss in comments written as prose.
unescaped_backticks = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cargo_common_metadata = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# The back ends return owned markup and owned bytes: dropping either is a
# mistake the type system cannot see, but saying so on every function that
# returns a `String` is noise rather than a warning anyone reads.
must_use_candidate = "allow"

[package]
name = "adocers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Render AsciiDoc documents to HTML, with source-anchored diagnostics and a watch mode"
keywords = ["asciidoc", "html", "pdf", "asciidoctor", "cli"]
categories = ["command-line-utilities", "text-processing"]

# `resources/` carries two git submodules — Asciidoctor's own website and their
# Ruby doctest project — which the benchmarks and the doctest suite read. They
# are someone else's repositories and fifty times the size of this one, so a
# published crate does not carry them: both suites already skip what they
# cannot find. Excluding them takes the package from 7.1 MB to 136 KB.
exclude = [
  "resources/asciidoctor-doctest",
  "resources/asciidoctor.org",
  "CLAUDE.md",
]

[features]
default = ["serve", "highlight", "math", "mermaid", "pdf"]
serve = ["dep:axum", "dep:tokio", "dep:tokio-util", "dep:tower-http"]

# Draw mermaid diagrams, with `merman`. Without it a diagram renders as the
# listing block it was written as.
mermaid = ["adocers-html/mermaid", "adocers-typst?/mermaid"]

# PDF output, typeset by Typst — which is Rust, so a PDF needs no LaTeX, no
# headless browser and nothing fetched. Typst's own fonts come with it.
pdf = ["dep:adocers-typst"]

# Equations, converted to MathML for the browser to draw. Without it an
# equation renders as the notation it was written in — in a PDF too, since this
# is the switch that says whether equations are converted at all.
math = ["adocers-html/math", "adocers-typst?/math"]

# Syntax highlighting, and the grammars it parses with.
highlight = ["adocers-html/highlight"]

[dependencies]
adocers-html = { workspace = true, default-features = false }
adocers-typst = { workspace = true, default-features = false, optional = true }
anyhow.workspace = true
ariadne = "0.6"
asciidoc-parser.workspace = true
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
], optional = true }
clap = { version = "4", features = ["derive"] }
notify-debouncer-full = "0.7"
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "signal",
  "fs",
  "time",
  "sync",
], optional = true }
tokio-util = { version = "0.7", default-features = false, features = [
  "io",
], optional = true }
tower-http = { version = "0.7", features = [
  "compression-gzip",
  "compression-br",
], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "render"
harness = false

[lints]
workspace = true

[profile.deploy]
inherits = "release"
strip = true
lto = true
codegen-units = 1
panic = "abort"
